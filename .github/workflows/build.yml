name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same PR cancels the older run — no point compiling a commit
# nobody is going to look at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile on macOS
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          swift --version
          sw_vers

      # No flags on purpose. Every side effect in build.sh is opt-in:
      # --install copies to /Applications and opens a System Settings pane,
      # --dmg mounts a disk image, --run launches the app. None of that belongs
      # in CI. Bare `./build.sh` only compiles and signs ad-hoc.
      - name: Build (universal)
        working-directory: SaveMyMac
        run: |
          chmod +x build.sh
          ./build.sh --universal

      # A compiled binary that isn't a loadable bundle would still "pass" a build
      # step, so check the artifact rather than trusting the exit code.
      - name: Verify the bundle
        working-directory: SaveMyMac
        run: |
          APP=build/SaveMyMac.app
          BIN="$APP/Contents/MacOS/SaveMyMac"

          test -x "$BIN"          || { echo "::error::executable missing"; exit 1; }
          test -f "$APP/Contents/Info.plist" || { echo "::error::Info.plist missing"; exit 1; }

          echo "architectures: $(lipo -archs "$BIN")"
          lipo -archs "$BIN" | grep -q arm64  || { echo "::error::no arm64 slice"; exit 1; }
          lipo -archs "$BIN" | grep -q x86_64 || { echo "::error::no x86_64 slice"; exit 1; }

          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "bundle OK"

      # Regression guard for two bugs that cost a lot of time and are invisible
      # at compile time. Both are documented in CONTRIBUTING.md.
      - name: Check for known regressions
        working-directory: SaveMyMac
        run: |
          fail=0

          # Both patterns are anchored to the start of a line so they match
          # declarations and not prose. The first version of this check searched
          # anywhere in the file and failed against the codebase itself: the
          # comment in Preferences.swift explaining *why not to use* @Published
          # contains the word four times. A guard that fires on its own
          # documentation gets disabled by whoever hits it first.

          # @Published republishes on every assignment, even when the value did
          # not change. Combined with MenuBarExtra(isInserted:), which writes on
          # every update pass, that produced an update cycle at CPU speed.
          if grep -nE '^[[:space:]]*@Published' Sources/Support/Preferences.swift 2>/dev/null; then
            echo "::error file=Sources/Support/Preferences.swift::Preferences must not use @Published — setters have to compare before publishing. See CONTRIBUTING.md."
            fail=1
          fi

          # SMAppService.status is a synchronous XPC round trip to smd. Reading it
          # from a view initializer froze the whole app. Lines starting with `//`
          # or `///` are excluded so the explanation can mention the type.
          if grep -rnE '^[[:space:]]*(//|///)' --invert-match Sources/Views/*.swift \
               | grep -n 'SMAppService' 2>/dev/null; then
            echo "::error::SMAppService must not be reached from Sources/Views — it blocks the main thread. Use LaunchAtLogin.snapshot / refresh()."
            fail=1
          fi

          test "$fail" -eq 0 && echo "no known regressions"
          exit $fail

      # A translation with different %@/%d placeholders than its key crashes the
      # app at runtime, in that language only — String(format:) reads an argument
      # that was never passed. That ships easily, because a translator rarely
      # runs the app in the language they just edited. Cheap to catch here.
      - name: Check translations
        working-directory: SaveMyMac
        run: python3 tools/check-translations.py

      # Catches a hardcoded UI string before it ships. This is structural, not
      # language-based: it asks whether a literal in a UI position went through
      # the table, not what language it looks like. The earlier accent-based
      # sweep reported "clean" while 99 Portuguese strings were still hardcoded —
      # every one of them accent-free.
      - name: Check for hardcoded UI strings
        working-directory: SaveMyMac
        run: python3 tools/check-untranslated-ui.py

      # The only phase that actually executes the code that deletes files.
      # Everything above it is a regex over source text: it can tell you a guard
      # is still written, never that it still refuses.
      #
      # Compiled from the same sources as the app minus the UI layer, so it links
      # the real implementations rather than copies.
      #
      # The source list used to be duplicated here and in tools/e2e.sh, and the
      # two copies drifted within a day of each other: e2e.sh started including
      # AppState.swift when the AppSection cycle was broken, and this file kept
      # excluding it — so CI was quietly testing less than the local run. The
      # list now lives in one place, tests/sources.sh, and both consume it.
      - name: Behavioural tests
        working-directory: SaveMyMac
        run: |
          SOURCES=$(./tests/sources.sh)

          swiftc -O -swift-version 5 \
            -target "$(uname -m)-apple-macos13.0" \
            -framework AppKit -framework ServiceManagement -framework IOKit \
            -o build/e2e-tests \
            $SOURCES tests/E2EMain.swift

          ./build/e2e-tests

      - name: Upload app bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SaveMyMac-${{ github.sha }}
          path: SaveMyMac/build/SaveMyMac.app
          retention-days: 14
          if-no-files-found: error
